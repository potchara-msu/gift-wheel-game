<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎃 วงล้อจับสลากของขวัญ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="spooky" aria-hidden="true">
  <div class="moon"></div>
  <svg class="bat b1" viewBox="0 0 64 32" width="56" height="28"><path fill="#0a0a0a" d="M2 18c6-2 10-10 14-10 2 6 6 8 10 8s8-2 10-8c4 0 8 8 14 10-4 2-8 6-14 4-2 4-6 6-10 6s-8-2-10-6c-6 2-10-2-14-4z"/></svg>
  <svg class="bat b2" viewBox="0 0 64 32" width="42" height="21"><path fill="#111" d="M2 18c6-2 10-10 14-10 2 6 6 8 10 8s8-2 10-8c4 0 8 8 14 10-4 2-8 6-14 4-2 4-6 6-10 6s-8-2-10-6c-6 2-10-2-14-4z"/></svg>
  <svg class="bat b3" viewBox="0 0 64 32" width="36" height="18"><path fill="#0d0d0d" d="M2 18c6-2 10-10 14-10 2 6 6 8 10 8s8-2 10-8c4 0 8 8 14 10-4 2-8 6-14 4-2 4-6 6-10 6s-8-2-10-6c-6 2-10-2-14-4z"/></svg>
  <svg class="cobweb tl" viewBox="0 0 120 120" width="140" height="140"><g stroke="rgba(245,240,225,.28)" stroke-width="1.2" fill="none"><path d="M0 0 L120 0 M0 0 L0 120 M0 0 L100 40 M0 0 L40 100 M0 0 L80 80"/><path d="M18 0 Q22 22 0 18 M36 0 Q44 44 0 36 M58 0 Q70 70 0 58 M82 0 Q95 95 0 82"/></g></svg>
  <svg class="cobweb tr" viewBox="0 0 120 120" width="110" height="110"><g stroke="rgba(245,240,225,.22)" stroke-width="1.2" fill="none"><path d="M120 0 L0 0 M120 0 L120 120 M120 0 L20 40 M120 0 L80 100 M120 0 L40 80"/><path d="M102 0 Q98 22 120 18 M84 0 Q76 44 120 36 M62 0 Q50 70 120 58"/></g></svg>
  <div class="fog f1"></div>
  <div class="fog f2"></div>
</div>
<header class="top">
  <h1>🎃 วงล้อจับสลากของขวัญ 👻</h1>
  <div class="tools">
    <button id="btnMute" class="tbtn" title="เปิด/ปิดเสียง">🔊</button>
    <button id="btnFull" class="tbtn" title="เต็มจอ">⛶</button>
  </div>
</header>

<main class="stage">
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="1000" height="1000"></canvas>
    <button id="btnSpin" class="hub">หมุน!</button>
  </div>
</main>

<footer class="history">
  <span class="hlabel">ผลล่าสุด:</span>
  <div id="hist" class="hchips"></div>
  <button id="btnClear" class="tbtn small" title="ล้างประวัติ">ล้าง</button>
</footer>

<div id="overlay" class="overlay hidden">
  <div id="card" class="card">
    <div class="card-inner" id="cardInner">
      <div class="cl">
        <div class="card-num" id="cNum">ช่อง 1</div>
        <div class="card-icon" id="cIcon">🎃</div>
        <div class="card-extra" id="cExtra"></div>
      </div>
      <div class="cr">
        <div class="card-title" id="cTitle">หยิบ 1 ชิ้น</div>
        <div class="card-note" id="cNote"></div>
        <div class="card-text" id="cText"></div>
      </div>
      <div class="card-remind">📌 มีเกิน 1 ชิ้นแกะได้ 1 · ชิ้นเดียวแกะไม่ได้ · แกล้ง/ปล้นได้แค่ของที่ยังห่อ</div>
      <div class="card-close" id="cClose">แตะจอ หรือกด Spacebar เพื่อหมุนต่อ</div>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>
<script src="app.js"></script>
</body>
</html>
